name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ---------------------------------------------------------- Python impl
  python-tests:
    name: python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          # full python matrix on linux; latest-only on mac/windows
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install clang (builtin headers for libclang) — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Install LLVM (clang for builtin headers) — Windows
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      # macOS: Xcode Command Line Tools provide clang out of the box
      - name: Install package
        run: pip install -e .[test]
      - name: Run tests
        run: pytest -v

  # ------------------------------------------------------------- C++ impl
  cpp-tests:
    name: cpp / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cython (fixture validation)
        run: pip install cython
      - name: Install LLVM + ninja — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang ninja-build cmake
      - name: Install LLVM + ninja — macOS
        if: runner.os == 'macOS'
        run: brew install llvm ninja cmake
      - name: Bootstrap (clone cppast, build, run fixtures)
        working-directory: cpp
        run: ./bootstrap.sh
      - name: Gate on fixture results
        working-directory: cpp
        run: bash run_tests.sh
      - name: scikit-build packaging (pip install ./cpp)
        run: |
          pip install -v ./cpp
          cppast-autopxd --version
          python -c "import cppast_autopxd_native as n; print(n.tool_path())"

  # Windows C++ build is experimental: cppast + MSVC/LLVM interplay is not
  # yet part of the supported matrix; failures here do not gate merges.
  cpp-tests-windows:
    name: cpp / windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LLVM + ninja
        run: |
          choco install llvm ninja -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Install cython
        run: pip install cython
      - name: Clone cppast
        run: git clone --depth 1 https://github.com/foonathan/cppast.git cpp/.deps/cppast
      - name: Configure + build
        shell: bash
        working-directory: cpp
        run: |
          # The LLVM Windows distribution ships no llvm-config.exe, so use
          # cppast's explicit-variables path (all four must be set together).
          CLANG_EXE="$(command -v clang)"
          LLVM_PREFIX="$(dirname "$(dirname "$CLANG_EXE")")"
          LLVM_VER="$(clang --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "clang=$CLANG_EXE prefix=$LLVM_PREFIX version=$LLVM_VER"
          # MSVC's STL requires C++14+; cppast's own minimum is C++11, so
          # raise the whole build to C++17 on Windows. CMAKE_CXX_FLAGS is
          # appended to every TU after the feature-derived -std flag, so the
          # 17 reliably wins regardless of per-target compile features.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_FLAGS="-std=c++17" \
            -DLLVM_VERSION_EXPLICIT="$LLVM_VER" \
            -DLIBCLANG_LIBRARY="$LLVM_PREFIX/lib/libclang.lib" \
            -DLIBCLANG_INCLUDE_DIR="$LLVM_PREFIX/include" \
            -DCLANG_BINARY="$CLANG_EXE"
          cmake --build build --target cppast_autopxd -- -v
      - name: Run fixtures
        shell: bash
        working-directory: cpp
        run: bash run_tests.sh
