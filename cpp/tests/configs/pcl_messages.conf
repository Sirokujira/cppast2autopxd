# Cross-header rules shared by PCL's common message headers.
#
# Every header below needs the same substitution, because pcl/types.h (which
# declares uindex_t) is template metaprogramming the tool does not generate;
# the alias is resolved to its underlying type instead. The per-header
# cimports differ, so they stay on the command line in sweep_real_pcl.sh —
# this file carries only what is common to the whole set.
typemap = uindex_t = uint32_t
